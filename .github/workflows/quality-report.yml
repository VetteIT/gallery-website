name: Quality Report & GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --run --coverage --coverage.provider=v8

      - name: Generate Quality Report
        run: npm run report

      - name: Create index redirect
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=QualityReport.html">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="QualityReport.html">Quality Report</a>...</p>
          </body>
          </html>
          EOF

      - name: Commit Quality Report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/QualityReport.html docs/QualityReport.md docs/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update quality report [skip ci]" && git push)

      - name: Upload Quality Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            docs/QualityReport.html
            docs/QualityReport.md
          retention-days: 90
